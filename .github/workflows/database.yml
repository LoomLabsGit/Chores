name: Database migrations

# Applies new files in supabase/migrations/ to the production Supabase project whenever
# they land on main, so nobody has to paste SQL by hand. Vercel deploys the app separately.
#
# Needs three repository secrets (Settings -> Secrets and variables -> Actions):
#   SUPABASE_ACCESS_TOKEN  personal access token (supabase.com/dashboard/account/tokens)
#   SUPABASE_DB_PASSWORD   the project's database password
#   SUPABASE_PROJECT_ID    the project ref, e.g. eagonrdlwctaxdbecyov
# Until all three exist this workflow only prints a warning and changes nothing.

on:
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
  workflow_dispatch:
    inputs:
      baseline:
        description: >-
          ONE-TIME: mark these migrations as already applied (space-separated versions) because they
          were run by hand before this automation existed. Leave empty afterwards.
        type: string
        default: ""

permissions:
  contents: read

# Never run two migration jobs at once, and never cancel one halfway.
concurrency:
  group: database-migrations
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    env:
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - name: Check and tidy the Supabase secrets
        id: gate
        env:
          RAW_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          RAW_PROJECT: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: |
          if [ -z "$RAW_TOKEN" ] || [ -z "$SUPABASE_DB_PASSWORD" ] || [ -z "$RAW_PROJECT" ]; then
            echo "::warning title=Migrations NOT applied::Add SUPABASE_ACCESS_TOKEN, SUPABASE_DB_PASSWORD and SUPABASE_PROJECT_ID as repository secrets, then re-run this workflow."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Copy/paste often adds a trailing newline, spaces or quote marks. Strip them.
          token="$(printf '%s' "$RAW_TOKEN" | tr -d "[:space:]\"'")"
          project="$(printf '%s' "$RAW_PROJECT" | tr -d "[:space:]\"'")"
          echo "::add-mask::$token"

          # Report only the SHAPE of each value (never its contents) so a wrong secret is easy to spot.
          starts_ok=no; case "$token" in sbp_*) starts_ok=yes ;; esac
          echo "Access token: ${#RAW_TOKEN} characters saved, ${#token} after tidying, starts with sbp_: $starts_ok (a real one is 44 characters)"
          echo "Project id:   ${#RAW_PROJECT} characters saved, ${#project} after tidying (a real one is 20 lowercase letters)"

          if ! printf '%s' "$token" | grep -Eq '^sbp_(oauth_)?[a-f0-9]{40}$'; then
            echo "::error title=SUPABASE_ACCESS_TOKEN is not a valid access token::It must look like sbp_ followed by 40 letters/numbers. Create a new one at supabase.com/dashboard/account/tokens and save it as the SUPABASE_ACCESS_TOKEN secret. See the line above for what was found."
            exit 1
          fi
          if ! printf '%s' "$project" | grep -Eq '^[a-z]{20}$'; then
            echo "::error title=SUPABASE_PROJECT_ID is not a valid project id::It must be exactly the 20 lowercase letters of your project reference (not the URL). See the line above for what was found."
            exit 1
          fi

          echo "SUPABASE_ACCESS_TOKEN=$token" >> "$GITHUB_ENV"
          echo "SUPABASE_PROJECT_ID=$project" >> "$GITHUB_ENV"
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        if: steps.gate.outputs.ready == 'true'

      - uses: actions/setup-node@v4
        if: steps.gate.outputs.ready == 'true'
        with:
          node-version: 22
          cache: npm

      # The migrations must pass the SQL test suite before they get anywhere near production.
      - name: Test the migrations
        if: steps.gate.outputs.ready == 'true'
        run: |
          npm ci
          npm run test:db

      - uses: supabase/setup-cli@v1
        if: steps.gate.outputs.ready == 'true'
        with:
          version: latest

      - name: Link to the Supabase project
        if: steps.gate.outputs.ready == 'true'
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"

      - name: Baseline (one-time)
        if: steps.gate.outputs.ready == 'true' && inputs.baseline != ''
        env:
          VERSIONS: ${{ inputs.baseline }}
        run: supabase migration repair --status applied $VERSIONS

      - name: Show what will be applied
        if: steps.gate.outputs.ready == 'true'
        run: supabase db push --dry-run

      - name: Apply migrations
        if: steps.gate.outputs.ready == 'true'
        run: supabase db push --yes
