<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline · DuoSync</title>
    <style>
      :root { color-scheme: light dark; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; text-align: center; padding: 24px;
             font-family: ui-rounded, system-ui, sans-serif; background: #f6f3ee; color: #1e1b2e; }
      @media (prefers-color-scheme: dark) { body { background: #14121d; color: #f1eefb; } }
      button { margin-top: 16px; min-height: 48px; padding: 0 24px; border: 0; border-radius: 16px;
               background: #5b4bdb; color: #fff; font: inherit; font-weight: 800; }
    </style>
  </head>
  <body>
    <main>
      <h1>You're offline</h1>
      <p>DuoSync needs a connection to keep you and your partner in sync.</p>
      <button onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
